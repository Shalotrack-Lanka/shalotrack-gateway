# Tests the Streamlit console that lives in console/. Separate from cicd.yml on purpose:
# this workflow never logs in to AWS and never pushes an image.
name: Console CI

on:
  push:
    branches: [main]
    paths:
      - "console/**"
      # the console's contract test runs the real gateway Command API code, so a gateway
      # change that would break the console is caught here
      - "command_api.py"
      - "services/**"
      - "utils/**"
      - "requirements.txt"
      - ".github/workflows/console-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "console/**"
      - "command_api.py"
      - "services/**"
      - "utils/**"
      - "requirements.txt"
      - ".github/workflows/console-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # console requirements + the gateway's own (needed by the contract test)
      - run: pip install -r requirements-dev.txt -r ../requirements.txt
      - run: python -m pytest -q
      - name: Console image builds
        run: docker build -t gateway-console:ci .
