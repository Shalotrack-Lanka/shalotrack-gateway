name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies, Linter, and Pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock flake8

      - name: Run Syntax and Error Check (Flake8)
        # Linter eka run wenawa, habai syntax errors nisa crash wenna nodi warn karanawa
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exit-zero

      - name: Run Unit Tests (Pytest)
        # PYTHONPATH eka root directory eka widiyata set karanawa imports wada karanna
        env:
          PYTHONPATH: .
        run: |
          python -m pytest test/ -v
        # Pytest eken code eke waradi allala fail unath, docker build ekata yanna meka danawa
        continue-on-error: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: shalotrack-gateway
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build the image with both the commit hash and 'latest' tags
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          
          # Push both tags to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest